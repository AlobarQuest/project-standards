# Secrets this repo consumes at runtime, by stable BWS UUID. Both are fetched by
# integrations/portfolio-scan.sh (the 03:00 com.devon.portfolio-scan LaunchAgent) on
# every run; neither value is ever written to this repository or to disk.
consumption = "environment-injection"

# The fine-grained PAT the nightly scan probes repository reach with (Q2 factory
# capability checks). Fetched with the narrow sds-operator identity (Keychain service
# `Claude`, account BWS_ACCESS_TOKEN_SDS) and exported to the scan as FACTORY_PR_TOKEN.
# Rotated by the SDS rotation executor (orchestrator ADR-0055 increment 7); this repo
# is a scheduled reader, verified through the Healthchecks check `portfolio-scan`.
# factory-runner's .bws-secrets.toml records the token's Actions-secret copies.
[[secret]]
uuid = "a3240c2e-92d7-4b32-a726-b49b0135565a"
name = "FACTORY_PR_TOKEN"
project = "SDS Operator"

# The Healthchecks Management API key the scan uses to resolve its own check by name
# (the shape of orchestrator's scripts/sds-deadman.sh). Fetched with the broad machine
# identity (Keychain service `Claude`, account BWS_ACCESS_TOKEN_VPS_BACKUP).
[[secret]]
uuid = "260cc8ad-f170-44cc-a672-b47000df3350"
name = "healthchecks.io_api_key"
project = "Ops / Platform"
