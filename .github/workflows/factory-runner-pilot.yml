name: Factory Runner Pilot

on:
  workflow_dispatch:
    inputs:
      work_unit_id:
        description: Approved orchestrator work-unit ID
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  factory-runner:
    # Pinned to a SHA, never @main. From factory-runner b0305b5 onward the reusable
    # workflow installs its OWN commit (`uv tool install …@${{ job.workflow_sha }}`),
    # so this `uses:` SHA IS the CLI revision that will run — which is what the
    # orchestrator's `Runner brief compatibility` job checks the served brief against.
    # A mutable @main ref makes that check meaningless: the pin it reads would not
    # describe the code that runs. Advance this only alongside that check (WS-P2.23).
    uses: AlobarQuest/factory-runner/.github/workflows/factory-runner.yml@5178471a51f531c1cb4b25da39d4e164267543ba
    with:
      work_unit_id: ${{ inputs.work_unit_id }}
      orchestrator_url: https://sds.alobar.net
    secrets:
      FACTORY_RUNNER_TOKEN: ${{ secrets.FACTORY_RUNNER_TOKEN }}
      FACTORY_RUNNER_CREDENTIAL_KEY_ID: ${{ secrets.FACTORY_RUNNER_CREDENTIAL_KEY_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FACTORY_PR_TOKEN: ${{ secrets.FACTORY_PR_TOKEN }}
